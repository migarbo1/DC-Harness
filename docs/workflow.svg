<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1135" viewBox="0 0 680 1135" role="img">
<title>DC-Harness development workflow</title>
<desc>Vertical flow from /dc:start-task through clarification, spec approval, planning, plan approval, fresh session, checkpoint-by-checkpoint implementation, assessment and PR text, with loops for clarification, feedback, re-approval on change, stop-hook checks, next checkpoint and assessment retries.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .head { stroke: #5F5E5A; }
  .p rect { fill: #EEEDFE; stroke: #534AB7; }
  .p .th { fill: #3C3489; }
  .p .ts { fill: #534AB7; }
  .a rect { fill: #FAEEDA; stroke: #854F0B; }
  .a .th { fill: #633806; }
  .a .ts { fill: #854F0B; }
  .g rect { fill: #F1EFE8; stroke: #888780; }
  .g .th { fill: #2C2C2A; }
  @media (prefers-color-scheme: dark) {
    .ts { fill: #B4B2A9; }
    .arr, .head { stroke: #B4B2A9; }
    .p rect { fill: #3C3489; stroke: #AFA9EC; }
    .p .th { fill: #EEEDFE; }
    .p .ts { fill: #CECBF6; }
    .a rect { fill: #633806; stroke: #FAC775; }
    .a .th { fill: #FAEEDA; }
    .a .ts { fill: #FAC775; }
    .g rect { fill: #444441; stroke: #B4B2A9; }
    .g .th { fill: #F1EFE8; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="p"><rect x="180" y="30" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="49" text-anchor="middle" dominant-baseline="central">/dc:start-task</text>
<text class="ts" x="320" y="67" text-anchor="middle" dominant-baseline="central">Check tree, record commit-ref</text></g>
<line x1="320" y1="86" x2="320" y2="116" class="arr" marker-end="url(#arrow)"/>

<g class="p"><rect x="180" y="120" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="139" text-anchor="middle" dominant-baseline="central">Clarifying questions</text>
<text class="ts" x="320" y="157" text-anchor="middle" dominant-baseline="central">One at a time</text></g>
<path d="M460 138 C505 138, 505 158, 462 158" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="512" y="148" dominant-baseline="central">↻ until concrete</text>
<line x1="320" y1="176" x2="320" y2="206" class="arr" marker-end="url(#arrow)"/>

<g class="p"><rect x="180" y="210" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="229" text-anchor="middle" dominant-baseline="central">Write spec.md</text>
<text class="ts" x="320" y="247" text-anchor="middle" dominant-baseline="central">Developer reviews</text></g>
<path d="M460 228 C505 228, 505 248, 462 248" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="512" y="238" dominant-baseline="central">↻ feedback, revise</text>
<line x1="320" y1="266" x2="320" y2="296" class="arr" marker-end="url(#arrow)"/>

<g class="a"><rect x="180" y="300" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="319" text-anchor="middle" dominant-baseline="central">"specification agreed"</text>
<text class="ts" x="320" y="337" text-anchor="middle" dominant-baseline="central">Hook stores phrase + spec hash</text></g>
<path d="M180 328 L150 328 L150 238 L176 238" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="142" y="283" text-anchor="end" dominant-baseline="central">spec changed</text>
<line x1="320" y1="356" x2="320" y2="386" class="arr" marker-end="url(#arrow)"/>

<g class="p"><rect x="180" y="390" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="409" text-anchor="middle" dominant-baseline="central">/dc:plan</text>
<text class="ts" x="320" y="427" text-anchor="middle" dominant-baseline="central">Read-only, checkpoints in plan.md</text></g>
<path d="M460 408 C505 408, 505 428, 462 428" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="512" y="418" dominant-baseline="central">↻ feedback, revise</text>
<line x1="320" y1="446" x2="320" y2="476" class="arr" marker-end="url(#arrow)"/>

<g class="a"><rect x="180" y="480" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="499" text-anchor="middle" dominant-baseline="central">"Plan agreed"</text>
<text class="ts" x="320" y="517" text-anchor="middle" dominant-baseline="central">Hook stores phrase + plan hash</text></g>
<path d="M180 508 L150 508 L150 418 L176 418" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="142" y="463" text-anchor="end" dominant-baseline="central">plan changed</text>
<line x1="320" y1="536" x2="320" y2="566" class="arr" marker-end="url(#arrow)"/>

<g class="a"><rect x="180" y="570" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="589" text-anchor="middle" dominant-baseline="central">/clear</text>
<text class="ts" x="320" y="607" text-anchor="middle" dominant-baseline="central">Fresh session required</text></g>
<line x1="320" y1="626" x2="320" y2="656" class="arr" marker-end="url(#arrow)"/>

<g class="p"><rect x="180" y="660" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="679" text-anchor="middle" dominant-baseline="central">/dc:implement</text>
<text class="ts" x="320" y="697" text-anchor="middle" dominant-baseline="central">First undone checkpoint, full check</text></g>
<path d="M460 678 C505 678, 505 698, 462 698" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="512" y="688" dominant-baseline="central">↻ Stop hook: until</text>
<text class="ts" x="512" y="704" dominant-baseline="central">affected checks pass</text>
<line x1="320" y1="716" x2="320" y2="746" class="arr" marker-end="url(#arrow)"/>

<g class="a"><rect x="180" y="750" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="769" text-anchor="middle" dominant-baseline="central">Developer checks</text>
<text class="ts" x="320" y="787" text-anchor="middle" dominant-baseline="central">Notes entry written, no commit</text></g>
<path d="M180 778 L150 778 L150 688 L176 688" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="142" y="725" text-anchor="end" dominant-baseline="central">next</text>
<text class="ts" x="142" y="741" text-anchor="end" dominant-baseline="central">checkpoint</text>
<line x1="320" y1="806" x2="320" y2="836" class="arr" marker-end="url(#arrow)"/>

<g class="a"><rect x="180" y="840" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="859" text-anchor="middle" dominant-baseline="central">/dc:assessment</text>
<text class="ts" x="320" y="877" text-anchor="middle" dominant-baseline="central">All checkpoints done; N questions</text></g>
<path d="M460 858 C505 858, 505 878, 462 878" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="512" y="860" dominant-baseline="central">↻ wrong / not sure:</text>
<text class="ts" x="512" y="876" dominant-baseline="central">hint, retry (max N)</text>
<line x1="320" y1="896" x2="320" y2="926" class="arr" marker-end="url(#arrow)"/>

<g class="p"><rect x="180" y="930" width="280" height="56" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="949" text-anchor="middle" dominant-baseline="central">/dc:pr-text</text>
<text class="ts" x="320" y="967" text-anchor="middle" dominant-baseline="central">Summary up to prTextMaxChars</text></g>
<line x1="320" y1="986" x2="320" y2="1016" class="arr" marker-end="url(#arrow)"/>

<g class="g"><rect x="180" y="1020" width="280" height="44" rx="8" stroke-width="0.75"/>
<text class="th" x="320" y="1042" text-anchor="middle" dominant-baseline="central">Paste into PR by hand</text></g>

<g class="p"><rect x="180" y="1092" width="14" height="14" rx="3" stroke-width="0.75"/></g>
<text class="ts" x="202" y="1099" dominant-baseline="central">Agent step</text>
<g class="a"><rect x="300" y="1092" width="14" height="14" rx="3" stroke-width="0.75"/></g>
<text class="ts" x="322" y="1099" dominant-baseline="central">Developer gate</text>
<text class="ts" x="440" y="1099" dominant-baseline="central">Left arrows: go back</text>
</svg>
